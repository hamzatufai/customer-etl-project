name: 'snowflake_etl'
version: '1.0.0'
config-version: 2

profile: 'snowflake_etl'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  snowflake_etl:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
      +schema: intermediate
    mart:
      +materialized: table
      +schema: mart

seeds:
  snowflake_etl:
    +schema: raw
